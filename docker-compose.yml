services:
  calendario-personal:
    build:
      context: .
      dockerfile: Dockerfile
    image: calendario-personal:latest
    container_name: calendario_personal
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3003}:8000"
    volumes:
      # Persistent SQLite database, UI settings (settings.env) and daily backups
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DATABASE_URL=sqlite:////app/data/calendar.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
